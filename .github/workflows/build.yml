name: Gerar instalador do Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar os arquivos
        uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Gerar o instalador
        run: npm run build

      - name: Guardar o instalador para download
        uses: actions/upload-artifact@v4
        with:
          name: PDV-Facil-Instalador
          path: dist/*.exe
          if-no-files-found: error
